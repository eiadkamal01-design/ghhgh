<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أصل الفريسكا - أبوحماد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #d97706;
      --primary-dark: #b45309;
      --accent: #f59e0b;
      --bg: #fffbeb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #fde68a;
      --whatsapp: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }

    header {
      background: linear-gradient(135deg, #92400e, #d97706);
      color: #fff;
      text-align: center;
      padding: 24px 16px 28px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 6px 20px rgba(180, 83, 9, 0.25);
    }

    .logo-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 12px;
      border-radius: 50%;
      padding: 4px;
      background: #fff;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 900;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.95rem;
      opacity: 0.95;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 2px 12px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 6px;
    }

    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .item-badge {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
      width: fit-content;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .item-desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .item-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .item-price {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--primary-dark);
    }

    .add-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .add-btn:hover {
      background: var(--primary-dark);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fef3c7;
      padding: 4px 8px;
      border-radius: 10px;
    }

    .qty-controls button {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 7px;
      background: var(--primary);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
    }

    .qty-controls span {
      font-weight: 800;
      min-width: 18px;
      text-align: center;
    }

    .order-box {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      margin-top: 22px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    .order-box h2 {
      font-size: 1.15rem;
      font-weight: 900;
      color: #92400e;
      margin-bottom: 12px;
    }

    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fffbeb;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .cart-row strong {
      color: #92400e;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
    }

    .totals {
      border-top: 1px dashed var(--border);
      padding-top: 10px;
      margin-top: 10px;
      font-size: 0.95rem;
    }

    .totals div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .totals .grand {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--primary-dark);
      margin-top: 6px;
    }

    .whatsapp-btn {
      width: 100%;
      margin-top: 14px;
      background: var(--whatsapp);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
    }

    .floating-bar {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 688px;
      background: #92400e;
      color: #fff;
      padding: 12px 18px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      z-index: 50;
    }

    .floating-bar.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-wrap">
      <!-- تأكد من وضع صورة المحل بنفس الاسم في نفس مجلد index.html على GitHub -->
      <img src="logo.jpg" alt="أصل الفريسكا" onerror="this.src='https://via.placeholder.com/150/d97706/ffffff?text=فريسكا'" />
    </div>
    <h1>أصل الفريسكا 🧇</h1>
    <p>أحلى فريسكا وبان كيك وموناليزا في أبوحماد</p>
  </header>

  <div class="container">
    <!-- أزرار الأقسام -->
    <div class="tabs" id="categoryTabs"></div>

    <!-- قائمة الأصناف -->
    <div class="menu-grid" id="menuGrid"></div>

    <!-- سلة الطلبات وبيانات التوصيل -->
    <div class="order-box" id="orderSection">
      <h2>🛒 سلة طلباتك</h2>
      <div class="cart-list" id="cartList">
        <p style="color: var(--muted); font-size: 0.9rem;">السلة فاضية حالياً.. اختار اللي نفسك فيه من المنيو فوق.</p>
      </div>

      <div class="form-group">
        <label>الاسم بالكامل *</label>
        <input type="text" id="customerName" placeholder="اكتب اسمك" />
      </div>

      <div class="form-group">
        <label>رقم الموبايل *</label>
        <input type="tel" id="customerPhone" placeholder="01xxxxxxxxx" />
      </div>

      <div class="form-group">
        <label>منطقة التوصيل *</label>
        <select id="deliveryArea" onchange="renderCart()">
          <option value="0" data-label="استلام من المحل">استلام من المحل (مجاناً)</option>
          <option value="15" data-label="داخل أبوحماد">توصيل داخل أبوحماد (+15 ج)</option>
          <option value="25" data-label="خارج أبوحماد">توصيل خارج أبوحماد (+25 ج)</option>
        </select>
      </div>

      <div class="form-group">
        <label>العنوان بالتفصيل *</label>
        <input type="text" id="customerAddress" placeholder="الشارع / علامة مميزة" />
      </div>

      <div class="form-group">
        <label>ملاحظات إضافية (اختياري)</label>
        <textarea id="orderNotes" rows="2" placeholder="مثلاً: زود صوص شوكولاتة أو بدون مكسرات"></textarea>
      </div>

      <div class="totals">
        <div><span>مجموع الأصناف:</span> <span id="subTotal">0 ج</span></div>
        <div><span>التوصيل:</span> <span id="deliveryFee">0 ج</span></div>
        <div class="grand"><span>الإجمالي النهائي:</span> <span id="grandTotal">0 ج</span></div>
      </div>

      <button class="whatsapp-btn" onclick="sendOrderToWhatsApp()">
        <span>إرسال الطلب على واتساب 📲</span>
      </button>
    </div>
  </div>

  <!-- شريط السلة السريع أسفل الشاشة -->
  <div class="floating-bar hidden" id="floatingBar" onclick="document.getElementById('orderSection').scrollIntoView({behavior: 'smooth'})">
    <span id="floatingCount">0 أصناف في السلة</span>
    <strong id="floatingTotal">0 ج — إتمام الطلب ⬆️</strong>
  </div>

  <script>
    // ==========================================
    // 1. إعدادات المحل والمنيو (عدّل الأسعار والأصناف من هنا)
    // ==========================================
    const WHATSAPP_NUMBER = "201000000000"; // اكتب رقم واتساب المحل بصيغة 201xxxxxxxxx

    const MENU_ITEMS = [
      // قسم فريسكا
      { id: 1, category: "فريسكا", name: "فريسكا نوتيلا", desc: "رقائق مقرمشة محشوة شوكولاتة نوتيلا", price: 25 },
      { id: 2, category: "فريسكا", name: "فريسكا لوتس", desc: "بسكويت لوتس مطحون مع زبدة اللوتس", price: 30 },
      { id: 3, category: "فريسكا", name: "فريسكا كيندر", desc: "شوكولاتة كيندر غنية ومقرمشة", price: 30 },
      { id: 4, category: "فريسكا", name: "فريسكا بستاشيو", desc: "كريمة الفستق الفاخرة", price: 35 },

      // قسم فريسكا ميكس
      { id: 5, category: "فريسكا ميكس", name: "ميكس نوتيلا ولوتس", desc: "نص نوتيلا ونص لوتس", price: 35 },
      { id: 6, category: "فريسكا ميكس", name: "ميكس سوبر أصل الفريسكا", desc: "نوتيلا + كيندر + مكسرات", price: 40 },

      // قسم بان كيك
      { id: 7, category: "بان كيك", name: "ميني بان كيك نوتيلا", desc: "12 قطعة بان كيك ساخنة مع صوص نوتيلا", price: 45 },
      { id: 8, category: "بان كيك", name: "ميني بان كيك لوتس", desc: "12 قطعة بان كيك مع صوص وبسكويت لوتس", price: 50 },
      { id: 9, category: "بان كيك", name: "ميني بان كيك ميكس", desc: "تشكيلة صوصات (نوتيلا - لوتس - وايت شوكليت)", price: 55 },

      // قسم موناليزا
      { id: 10, category: "موناليزا", name: "موناليزا شوكولاتة", desc: "وصفة الموناليزا الخاصة بصوص الشوكولاتة", price: 40 },
      { id: 11, category: "موناليزا", name: "موناليزا مكسرات وفواكه", desc: "موناليزا محشوة كريمة ومكسرات", price: 45 }
    ];

    let activeCategory = "الكل";
    let cart = {}; // { id: quantity }

    // ==========================================
    // 2. عرض الأقسام والمنيو
    // ==========================================
    function renderTabs() {
      const categories = ["الكل", ...new Set(MENU_ITEMS.map(item => item.category))];
      const tabsEl = document.getElementById("categoryTabs");
      tabsEl.innerHTML = categories.map(cat => `
        <button class="tab-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">
          ${cat}
        </button>
      `).join("");
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderTabs();
      renderMenu();
    }

    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      const filtered = activeCategory === "الكل"
        ? MENU_ITEMS
        : MENU_ITEMS.filter(item => item.category === activeCategory);

      grid.innerHTML = filtered.map(item => {
        const qty = cart[item.id] || 0;
        return `
          <div class="item-card">
            <div>
              <span class="item-badge">${item.category}</span>
              <div class="item-title">${item.name}</div>
              <div class="item-desc">${item.desc}</div>
            </div>
            <div class="item-footer">
              <span class="item-price">${item.price} ج</span>
              ${qty === 0
                ? `<button class="add-btn" onclick="updateQty(${item.id}, 1)">+ أضف</button>`
                : `<div class="qty-controls">
                    <button onclick="updateQty(${item.id}, -1)">-</button>
                    <span>${qty}</span>
                    <button onclick="updateQty(${item.id}, 1)">+</button>
                  </div>`
              }
            </div>
          </div>
        `;
      }).join("");
    }

    function updateQty(id, delta) {
      const next = (cart[id] || 0) + delta;
      if (next <= 0) {
        delete cart[id];
      } else {
        cart[id] = next;
      }
      renderMenu();
      renderCart();
    }

    // ==========================================
    // 3. تحديث السلة والإجمالي
    // ==========================================
    function renderCart() {
      const cartList = document.getElementById("cartList");
      const itemsInCart = Object.keys(cart).map(id => {
        const item = MENU_ITEMS.find(m => m.id === Number(id));
        return { ...item, qty: cart[id] };
      });

      const subTotal = itemsInCart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const delivery = Number(document.getElementById("deliveryArea").value || 0);
      const grandTotal = itemsInCart.length ? subTotal + delivery : 0;

      document.getElementById("subTotal").textContent = `${subTotal} ج`;
      document.getElementById("deliveryFee").textContent = `${itemsInCart.length ? delivery : 0} ج`;
      document.getElementById("grandTotal").textContent = `${grandTotal} ج`;

      const floatingBar = document.getElementById("floatingBar");
      if (itemsInCart.length === 0) {
        cartList.innerHTML = `<p style="color: var(--muted); font-size: 0.9rem;">السلة فاضية حالياً.. اختار اللي نفسك فيه من المنيو فوق.</p>`;
        floatingBar.classList.add("hidden");
        return;
      }

      floatingBar.classList.remove("hidden");
      const totalCount = itemsInCart.reduce((s, i) => s + i.qty, 0);
      document.getElementById("floatingCount").textContent = `${totalCount} أصناف في السلة`;
      document.getElementById("floatingTotal").textContent = `${grandTotal} ج — إتمام الطلب ⬆️`;

      cartList.innerHTML = itemsInCart.map(item => `
        <div class="cart-row">
          <div>
            <strong>[${item.category}]</strong> ${item.name} × ${item.qty}
          </div>
          <div><strong>${item.price * item.qty} ج</strong></div>
        </div>
      `).join("");
    }

    // ==========================================
    // 4. إرسال الطلب للواتساب مع إظهار نوع الصنف بوضوح
    // ==========================================
    function sendOrderToWhatsApp() {
      const itemsInCart = Object.keys(cart).map(id => {
        const item = MENU_ITEMS.find(m => m.id === Number(id));
        return { ...item, qty: cart[id] };
      });

      if (itemsInCart.length === 0) {
        alert("من فضلك اختار صنف واحد على الأقل الأول!");
        return;
      }

      const name = document.getElementById("customerName").value.trim();
      const phone = document.getElementById("customerPhone").value.trim();
      const address = document.getElementById("customerAddress").value.trim();
      const notes = document.getElementById("orderNotes").value.trim();
      const areaSelect = document.getElementById("deliveryArea");
      const areaLabel = areaSelect.options[areaSelect.selectedIndex].dataset.label;
      const delivery = Number(areaSelect.value || 0);

      if (!name || !phone || !address) {
        alert("من فضلك اكتب الاسم ورقم الموبايل والعنوان.");
        return;
      }

      const subTotal = itemsInCart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const grandTotal = subTotal + delivery;

      // تنسيق كل صنف بحيث يظهر النوع (فريسكا / بان كيك / موناليزا) + اسم الصنف بوضوح
      const orderLines = itemsInCart.map((item, index) =>
        `${index + 1}. *[${item.category}]* ${item.name} × ${item.qty} = ${item.price * item.qty} ج`
      );

      const message = [
        "🧇 *طلب جديد - أصل الفريسكا* 🧇",
        "━━━━━━━━━━━━━━",
        ...orderLines,
        "━━━━━━━━━━━━━━",
        `💰 *مجموع الأصناف:* ${subTotal} ج`,
        `🛵 *التوصيل (${areaLabel}):* ${delivery} ج`,
        `✅ *الإجمالي النهائي:* ${grandTotal} ج`,
        "━━━━━━━━━━━━━━",
        `👤 *الاسم:* ${name}`,
        `📱 *الموبايل:* ${phone}`,
        `📍 *العنوان:* ${address}`,
        notes ? `📝 *ملاحظات:* ${notes}` : ""
      ].filter(Boolean).join("\n");

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    // تشغيل الصفحة
    renderTabs();
    renderMenu();
  </script>
</body>
</html>
